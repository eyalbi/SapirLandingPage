:root{--ivory:#FAF8F5;--sage:#8FAF8A;--sage-dark:#6A9164;--sage-light:#C5D9C3;--charcoal:#2D2926;--warm-gray:#7A6E68;--warm-border:#E8E2DB;--warm-card:#F3EFE9}
*{box-sizing:border-box;margin:0;padding:0}html{direction:rtl}
body{font-family:"Noto Sans Hebrew",Arial,sans-serif;background:var(--ivory);color:var(--charcoal);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px 40px}
.card{width:100%;max-width:400px;background:var(--warm-card);border:1.5px solid var(--sage-light);outline:1px solid var(--sage-light);outline-offset:5px;border-radius:22px;padding:22px 18px 20px;box-shadow:0 8px 28px rgba(45,41,38,.06)}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:50% 18%;display:block;margin:0 auto 12px;border:3px solid var(--sage-light)}
h1{font-size:22px;font-weight:700;text-align:center}
.title{text-align:center;color:var(--sage-dark);font-weight:500;font-size:14.5px;margin-top:2px}
.tag{text-align:center;color:var(--warm-gray);font-size:13px;margin:10px 0 6px;line-height:1.55}
.addr{display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 14px;font-size:12.5px;color:var(--sage-dark);text-decoration:none;font-weight:500}.tag b{display:block;color:var(--charcoal);font-weight:600;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--sage);background:var(--sage);color:#fff;margin-top:8px}
.btn.save{background:var(--charcoal);border-color:var(--charcoal);font-weight:500;font-size:14px;padding:9px 14px}
.btn:active,.tile:active{transform:scale(.985)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;background:transparent;border:1px solid var(--warm-border);border-radius:14px;padding:11px 4px 8px;color:var(--c);min-width:0}
.tile span{font-size:11px;color:var(--warm-gray);font-weight:500;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--warm-border)}
.qr{display:block;width:124px;height:124px;margin:0 auto 6px;border-radius:10px;background:#fff;padding:6px;border:1px solid var(--warm-border)}
.cap{text-align:center;color:var(--warm-gray);font-size:12px}.foot{text-align:center;margin-top:12px;font-size:13px}.foot a{color:var(--sage-dark);text-decoration:none;font-weight:500}
bdi{direction:ltr;unicode-bidi:isolate}
</style></head>
